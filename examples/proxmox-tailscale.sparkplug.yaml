version: "3.0"
kind: sparkplug.workflow
metadata:
  id: proxmox-tailscale
  name: Proxmox VE + Tailscale
  version: "0.2.0"
  author: MetalStrapper
  description: Patch the MetalStrapper generic Proxmox netboot ISO with a generated answer file and Tailscale first-boot script.

image: metalstrapper-proxmox-generic-netboot
fill:
  answer_toml: answer_toml
  firstboot_script: firstboot_script

actions:
  on_iso_ready:
    - id: generate-proxmox-root-password
      type: generate_ephemeral_password
      output_var: generated_proxmox_root_password
      user_secret: true
      user_secret_label: Proxmox root password
    - id: hash-proxmox-root-password
      type: hash_password
      input_var: generated_proxmox_root_password
      output_var: generated_proxmox_root_password_hash
      algorithm: sha512_crypt

config_fields:
  - id: pve_fqdn
    label: Proxmox FQDN
    type: text
    default: pve1.srv.home.arpa
    required: true
    max_length: 253
  - id: pve_keyboard
    label: Keyboard
    type: text
    default: en-us
    required: true
    storage:
      persist: "true"
  - id: pve_country
    label: Country
    type: text
    default: us
    required: true
    storage:
      persist: "true"
  - id: pve_timezone
    label: Timezone
    type: text
    required: true
    standard_field: locale.timezone
    storage:
      persist: "true"
  - id: pve_mailto
    label: Admin Email
    type: text
    default: root@example.invalid
    required: true
    standard_field: user.email
    storage:
      persist: "true"
  - id: pve_network_source
    label: Network Source
    type: select
    default: from-dhcp
    required: true
    options:
      - value: from-dhcp
        label: DHCP
      - value: from-answer
        label: Static
  - id: pve_network_cidr
    label: Static CIDR
    type: text
    default: ""
    advanced: true
    description: "Example: 192.0.2.10/24"
    when:
      field: pve_network_source
      operator: equals
      value: from-answer
  - id: pve_network_gateway
    label: Static Gateway
    type: text
    default: ""
    advanced: true
    when:
      field: pve_network_source
      operator: equals
      value: from-answer
  - id: pve_network_dns
    label: Static DNS
    type: text
    default: ""
    advanced: true
    when:
      field: pve_network_source
      operator: equals
      value: from-answer
  - id: pve_disk_filesystem
    label: Filesystem
    type: select
    default: ext4
    required: true
    options:
      - value: ext4
        label: ext4
      - value: xfs
        label: XFS
      - value: zfs
        label: ZFS
  - id: pve_disk_list
    label: Install Disks
    type: text
    default: '["sda"]'
    required: true
    description: TOML array of disk names, for example ["sda"] or ["sda", "sdb"].
  - id: pve_zfs_raid
    label: ZFS RAID
    type: select
    default: ""
    advanced: true
    options:
      - value: ""
        label: None
      - value: raid0
        label: RAID0
      - value: raid1
        label: RAID1 mirror
      - value: raid10
        label: RAID10
      - value: raidz-1
        label: RAIDZ-1
      - value: raidz-2
        label: RAIDZ-2
      - value: raidz-3
        label: RAIDZ-3
    when:
      field: pve_disk_filesystem
      operator: equals
      value: zfs
  - id: pve_root_ssh_keys
    label: Root SSH Keys
    type: text
    default: "[]"
    standard_field: user.ssh_public_keys
    storage:
      persist: "true"
    description: TOML array of SSH public keys, for example ["ssh-ed25519 AAAA... user@host"].
  - id: pve_reboot_mode
    label: Reboot Mode
    type: select
    default: reboot
    advanced: true
    options:
      - value: reboot
        label: Reboot
      - value: poweroff
        label: Power off
  - id: tailscale_auth_key
    label: Tailscale Auth Key
    type: password
    default: ""
    required: true

wizard:
  pages:
    - id: identity
      title: Identity
      fields:
        - pve_fqdn
        - pve_keyboard
        - pve_country
        - pve_timezone
        - pve_mailto
    - id: network
      title: Network
      fields:
        - pve_network_source
        - pve_network_cidr
        - pve_network_gateway
        - pve_network_dns
    - id: storage
      title: Storage
      fields:
        - pve_disk_filesystem
        - pve_disk_list
        - pve_zfs_raid
    - id: access
      title: Access
      fields:
        - pve_root_ssh_keys
        - pve_reboot_mode
        - tailscale_auth_key

artifacts:
  answer_toml:
    artifact_id: answer_toml
    media_type: application/toml
    template: answer_toml
  firstboot_script:
    artifact_id: firstboot_script
    media_type: text/x-shellscript
    template: firstboot_script

templates:
  answer_toml: |
    # Proxmox VE automated installation answer file rendered by SparkWriter.
    [global]
    keyboard = {{ pve_keyboard | toml_string }}
    country = {{ pve_country | toml_string }}
    fqdn = {{ pve_fqdn | toml_string }}
    mailto = {{ pve_mailto | toml_string }}
    timezone = {{ pve_timezone | toml_string }}
    root-password-hashed = {{ generated_proxmox_root_password_hash | toml_string }}
    root-ssh-keys = {{pve_root_ssh_keys}}
    reboot-mode = {{ pve_reboot_mode | toml_string }}
    [network]
    source = {{ pve_network_source | toml_string }}
    {% if pve_network_cidr %}
    cidr = {{ pve_network_cidr | toml_string }}
    gateway = {{ pve_network_gateway | toml_string }}
    dns = {{ pve_network_dns | toml_string }}
    {% endif %}
    [disk-setup]
    filesystem = {{ pve_disk_filesystem | toml_string }}
    disk-list = {{pve_disk_list}}
    {% if pve_zfs_raid %}
    zfs.raid = {{ pve_zfs_raid | toml_string }}
    {% endif %}
    [first-boot]
    source = "from-iso"
    ordering = "fully-up"
  firstboot_script: |
    #!/usr/bin/env bash
    set -Eeuo pipefail
    log() {
      printf '[sparkwriter-firstboot] %s\n' "$*" >&2
    }
    tailscale_auth_key={{ tailscale_auth_key | shell_quote }}
    set_trixie_repo_files() {
      mkdir -p /etc/apt/sources.list.d
      rm -f /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
      cat >/etc/apt/sources.list.d/debian.sources <<'EOF_DEBIAN'
    Types: deb
    URIs: http://deb.debian.org/debian
    Suites: trixie
    Components: main contrib
    Signed-By: /usr/share/keyrings/debian-archive-keyring.gpg
    Types: deb
    URIs: http://security.debian.org/debian-security
    Suites: trixie-security
    Components: main contrib
    Signed-By: /usr/share/keyrings/debian-archive-keyring.gpg
    Types: deb
    URIs: http://deb.debian.org/debian
    Suites: trixie-updates
    Components: main contrib
    Signed-By: /usr/share/keyrings/debian-archive-keyring.gpg
    EOF_DEBIAN
      cat >/etc/apt/sources.list.d/proxmox.sources <<'EOF_PVE_TRIXIE'
    Types: deb
    URIs: http://download.proxmox.com/debian/pve
    Suites: trixie
    Components: pve-no-subscription
    Signed-By: /usr/share/keyrings/proxmox-archive-keyring.gpg
    EOF_PVE_TRIXIE
      cat >/etc/apt/sources.list.d/ceph.sources <<'EOF_CEPH_TRIXIE'
    Types: deb
    URIs: http://download.proxmox.com/debian/ceph-squid
    Suites: trixie
    Components: pve-no-subscription
    Signed-By: /usr/share/keyrings/proxmox-archive-keyring.gpg
    EOF_CEPH_TRIXIE
    }
    normalize_proxmox_repositories() {
      if ! command -v pveversion >/dev/null 2>&1; then
        return 0
      fi
      local version major
      version="$(pveversion | awk -F'/' '{print $2}' | awk -F'-' '{print $1}')"
      major="${version%%.*}"
      if [ "$major" != "9" ]; then
        return 0
      fi
      set_trixie_repo_files
      export DEBIAN_FRONTEND=noninteractive
      apt-get update
    }
    normalize_proxmox_repositories
    export DEBIAN_FRONTEND=noninteractive
    command -v curl >/dev/null 2>&1 || apt-get update
    command -v curl >/dev/null 2>&1 || apt-get install -y curl ca-certificates
    curl -fsSL https://tailscale.com/install.sh | sh
    tailscale up --ssh --auth-key="$tailscale_auth_key"

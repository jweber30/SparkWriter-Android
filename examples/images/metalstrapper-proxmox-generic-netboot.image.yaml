version: "3.0"
kind: sparkplug.image
metadata:
  id: metalstrapper-proxmox-generic-netboot
  name: MetalStrapper Proxmox generic netboot ISO
  author: MetalStrapper

source:
  id: metalstrapper-proxmox-generic-netboot
  name: MetalStrapper Proxmox generic netboot ISO
  family: proxmox
  media_type: application/vnd.efi.iso
  url: https://repo.wri7e.net/metalstrapper-proxmox.iso
  sha256: fd438f0233337849e41a8ec632275bc769657e4befe64b25078fa1e9178c0b29
  size_bytes: 1707737088
  user_supplied: true
  capabilities:
    - proxmox-auto-install
    - answer_fetch.iso_placeholder
    - firstboot-script
    - firstboot_handoff.iso_placeholder
    - patchable-iso-text
  outputs:
    usb: true
    iso: true
  adaptation:
    status: patchable_on_import
    satisfies:
      - auto_install_mode
      - answer_fetch.iso_placeholder
      - firstboot_handoff.iso_placeholder

installer:
  scheme: proxmox-auto-install
  accepts_delivery:
    - fixed_byte_ranges
  base_image_requires:
    - auto_install_mode
    - answer_fetch.iso_placeholder
    - firstboot_handoff.iso_placeholder

delivery:
  mode: fixed_byte_ranges
  base_image_sha256: fd438f0233337849e41a8ec632275bc769657e4befe64b25078fa1e9178c0b29
  patches:
    - id: answer_toml
      media_type: application/toml
      logical_name: answer.toml
      byte_offset: 1706962944
      byte_length: 16384
      placeholder:
        encoding: metalstrapper-patch-slot
      padding:
        strategy: toml-comment
    - id: firstboot_script
      media_type: text/x-shellscript
      logical_name: proxmox-first-boot
      byte_offset: 1707356160
      byte_length: 65536
      placeholder:
        encoding: metalstrapper-patch-slot
      padding:
        strategy: shell-comment

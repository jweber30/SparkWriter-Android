# The user asks for a pinned NIC but never gives the MAC. The assistant must not
# invent one; the wizard opens on the Network page for the user to type it.
plug=proxmox-autoinstall
prompt=Static Proxmox at 10.0.0.5/24, gateway and DNS 10.0.0.1, pinned to the \
  management NIC by MAC. Hostname pve3.home.arpa, Chicago.
expect.pve_fqdn=pve3.home.arpa
expect.pve_timezone=America/Chicago
expect.pve_network_source=from-answer
expect.pve_network_nic=mac
expect.pve_network_cidr=10.0.0.5/24
expect.pve_network_gateway=10.0.0.1
expect.pve_network_dns=10.0.0.1
lands=Network

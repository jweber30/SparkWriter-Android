# What a user might say, and the values a good assistant should send to
# prepareSparkPlugDraft. AgentScenarioTest checks that every expected value is
# still accepted by the bundled SparkPlug, and that the draft lands where stated.
plug=proxmox-autoinstall
prompt=Make me a Proxmox USB for my homelab box. Call it pve-lab.home.arpa, Denver time, \
  just use DHCP, mail alerts to ops@example.net.
expect.pve_fqdn=pve-lab.home.arpa
expect.pve_timezone=America/Denver
expect.pve_mailto=ops@example.net
expect.pve_network_source=from-dhcp
# review = every required value present; otherwise the wizard page title.
lands=review

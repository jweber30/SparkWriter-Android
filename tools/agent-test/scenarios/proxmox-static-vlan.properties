plug=proxmox-autoinstall
prompt=Proxmox autoinstaller for pve2.srv.home.arpa in New York. Static 192.0.2.20/24, \
  gateway and DNS 192.0.2.1. Put management on VLAN 30 as 198.51.100.20/24 via \
  198.51.100.1. ZFS mirror on sda and sdb, and keep the enterprise repos.
expect.pve_fqdn=pve2.srv.home.arpa
expect.pve_timezone=America/New_York
expect.pve_network_source=from-answer
expect.pve_network_nic=only
expect.pve_network_cidr=192.0.2.20/24
expect.pve_network_gateway=192.0.2.1
expect.pve_network_dns=192.0.2.1
expect.pve_mgmt_vlan_id=30
expect.pve_mgmt_vlan_cidr=198.51.100.20/24
expect.pve_mgmt_vlan_gateway=198.51.100.1
expect.pve_disk_filesystem=zfs
expect.pve_disk_list=["sda", "sdb"]
expect.pve_zfs_raid=raid1
expect.pve_community_repos=keep
lands=review

$schema: https://json-schema.org/draft/2020-12/schema
$id: docs/sparkwriter_manifest_contract.schema.json
title: SparkWriter SparkPlug manifest contract
description: Machine-readable contract for SparkPlug v2.2 workflow documents and manifest.json
  package roots.
anyOf:
- $ref: '#/$defs/packageRootManifest'
- $ref: '#/$defs/workflowManifest'
$defs:
  sha256:
    type: string
    pattern: ^[a-f0-9]{64}$
  httpOrLocalAbsoluteUrl:
    type: string
    anyOf:
    - pattern: ^https://
  relativeReference:
    type: string
    pattern: ^(?!/)(?!.*\.\./)(?!.*\.\.\/)[^\s]+$
  safeAbsolutePath:
    type: string
    pattern: ^/[^\s]*$
  workflowManifest:
    type: object
    required:
    - version
    - metadata
    properties:
      version:
        const: '2.2'
      metadata:
        $ref: '#/$defs/metadata'
      source:
        $ref: '#/$defs/source'
      outputs:
        type: object
        properties:
          usb:
            type: boolean
          iso:
            type: boolean
        additionalProperties: false
      installer:
        $ref: '#/$defs/installer'
      artifacts:
        type: object
        additionalProperties:
          $ref: '#/$defs/artifact'
        propertyNames:
          type: string
          minLength: 1
      delivery:
        $ref: '#/$defs/delivery'
      mailroom:
        $ref: '#/$defs/mailroom'
      boot_patch:
        $ref: '#/$defs/bootPatch'
      actions:
        type: object
        additionalProperties:
          type: array
          items:
            $ref: '#/$defs/workflowAction'
          minItems: 1
      host_events:
        oneOf:
        - type: array
          items:
            $ref: '#/$defs/hostEvent'
        - type: object
          additionalProperties:
            oneOf:
            - $ref: '#/$defs/hostEvent'
            - type: array
              items:
                $ref: '#/$defs/hostEvent'
      return_delivery:
        type: object
        properties:
          url:
            type: string
          method:
            type: string
            default: POST
          delivery_mode:
            type: string
            default: best_effort
          endpoints:
            type: array
            items:
              type: object
              required:
              - id
              - url
              properties:
                id:
                  type: string
                  minLength: 1
                url:
                  type: string
              additionalProperties: true
        additionalProperties: true
      config_fields:
        type: array
        items:
          oneOf:
          - $ref: '#/$defs/configField'
          - $ref: '#/$defs/shortConfigField'
      wizard:
        type: object
        required:
        - pages
        properties:
          pages:
            type: array
            items:
              $ref: '#/$defs/wizardPage'
            minItems: 1
        additionalProperties: true
      ui_visibility:
        type: object
        additionalProperties: true
        properties:
          when:
            oneOf:
            - $ref: '#/$defs/fieldCondition'
            - type: array
              items:
                $ref: '#/$defs/fieldCondition'
              minItems: 1
      templates:
        type: object
        additionalProperties:
          type: string
      manifest_root_sha256:
        $ref: '#/$defs/sha256'
    additionalProperties: true
    not:
      anyOf:
      - required:
        - secure_manifest
      - required:
        - signature
    allOf:
    - if:
        properties:
          delivery:
            type: object
        required:
        - delivery
      then:
        required:
        - installer
  metadata:
    type: object
    required:
    - id
    - name
    properties:
      id:
        type: string
        minLength: 1
      name:
        type: string
        minLength: 1
      version:
        type: string
      author:
        type: string
      publisher:
        type: string
      description:
        type: string
      homepage:
        type: string
        format: uri
      manifest_root_sha256:
        $ref: '#/$defs/sha256'
    additionalProperties: true
  source:
    type: object
    required:
    - id
    properties:
      id:
        type: string
        minLength: 1
      name:
        type: string
        minLength: 1
      family:
        type: string
      version:
        type: string
      url:
        type: string
        format: uri
      sha256:
        $ref: '#/$defs/sha256'
      size_bytes:
        type: integer
        minimum: 0
      first_64k_sha256:
        $ref: '#/$defs/sha256'
      pvd_sha256:
        $ref: '#/$defs/sha256'
      media_type:
        type: string
      user_supplied:
        type: boolean
      capabilities:
        type: array
        items:
          type: string
      adaptation:
        type: object
        required:
        - status
        properties:
          status:
            type: string
            enum:
            - none
            - preadapted
            - produced
            - patchable_on_import
          satisfies:
            type: array
            items:
              type: string
          human_requirements:
            type: array
            items:
              type: string
        additionalProperties: true
      acquire:
        type: object
        properties:
          kind:
            type: string
            default: direct
          url:
            type: string
            format: uri
          artifact:
            type: string
        additionalProperties: true
      metadata:
        type: object
        additionalProperties:
          type: string
      outputs:
        $ref: '#/$defs/outputs'
    additionalProperties: true
  outputs:
    type: object
    properties:
      usb:
        type: boolean
      iso:
        type: boolean
    additionalProperties: false
  installer:
    type: object
    required:
    - scheme
    properties:
      scheme:
        type: string
        minLength: 1
      accepts_delivery:
        type: array
        items:
          type: string
      base_image_requires:
        type: array
        items:
          type: string
      auxiliary_partition:
        type: object
        required:
        - label
        properties:
          label:
            type: string
            minLength: 1
          filesystem:
            type: string
          required_files:
            type: array
            items:
              type: string
              pattern: ^/
        additionalProperties: true
    additionalProperties: true
  artifact:
    type: object
    properties:
      artifact_id:
        type: string
      media_type:
        type: string
      template:
        type: string
      optional:
        type: boolean
    additionalProperties: true
  delivery:
    type: object
    required:
    - mode
    properties:
      mode:
        type: string
        enum:
        - auxiliary_partition
        - fixed_byte_ranges
      id:
        type: string
      after:
        type: string
      base_image_sha256:
        $ref: '#/$defs/sha256'
      files:
        type: object
        additionalProperties:
          $ref: '#/$defs/deliveryFile'
        propertyNames:
          pattern: ^/
      partition:
        $ref: '#/$defs/deliveryPartition'
      patches:
        type: array
        items:
          $ref: '#/$defs/deliveryPatch'
        minItems: 1
    additionalProperties: true
    allOf:
    - if:
        properties:
          mode:
            const: auxiliary_partition
        required:
        - mode
      then:
        required:
        - partition
        - files
        properties:
          patches: false
    - if:
        properties:
          mode:
            const: fixed_byte_ranges
        required:
        - mode
      then:
        required:
        - base_image_sha256
        - patches
  deliveryPartition:
    type: object
    required:
    - label
    - filesystem
    - size_mb
    - placement
    properties:
      label:
        type: string
        minLength: 1
      filesystem:
        type: string
        default: vfat
      size_mb:
        type: integer
        minimum: 1
      placement:
        type: string
        enum:
        - preallocated_in_base_image
        - append_after_image
      geometry:
        $ref: '#/$defs/partitionGeometry'
    additionalProperties: true
  partitionGeometry:
    type: object
    required:
    - base_image_sha256
    - partition_table
    - partition_number
    - start_lba
    - sector_size
    - byte_offset
    - byte_length
    properties:
      base_image_sha256:
        $ref: '#/$defs/sha256'
      partition_table:
        type: string
      partition_number:
        type: integer
        minimum: 1
      start_lba:
        type: integer
        minimum: 0
      sector_size:
        type: integer
        minimum: 1
      byte_offset:
        type: integer
        minimum: 0
      byte_length:
        type: integer
        minimum: 1
    additionalProperties: true
  deliveryPatch:
    type: object
    required:
    - id
    - byte_offset
    - byte_length
    properties:
      id:
        type: string
        minLength: 1
      from:
        type: string
      artifact_id:
        type: string
      media_type:
        type: string
      logical_name:
        type: string
      byte_offset:
        type: integer
        minimum: 0
      byte_length:
        type: integer
        minimum: 1
      placeholder:
        type: object
        properties:
          encoding:
            type: string
          sha256:
            $ref: '#/$defs/sha256'
        additionalProperties: true
      padding:
        type: object
        properties:
          strategy:
            type: string
        additionalProperties: true
      optional:
        type: boolean
    additionalProperties: true
  deliveryFile:
    type: object
    properties:
      from:
        type: string
      artifact_id:
        type: string
      media_type:
        type: string
      optional:
        type: boolean
    additionalProperties: true
  mailroom:
    type: object
    properties:
      compact_artifacts:
        type: array
        items:
          $ref: '#/$defs/mailroomCompactArtifact'
    additionalProperties: true
  mailroomCompactArtifact:
    type: object
    required:
    - id
    properties:
      id:
        type: string
        pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$
      read_protocol:
        type: string
        enum:
        - http
        - https
      read_base_url:
        type: string
        pattern: ^https?://
      write_base_url:
        type: string
        pattern: ^https://
    additionalProperties: true
  bootPatch:
    type: object
    properties:
      filesystem:
        type: string
        default: iso9660
      candidate_paths:
        type: array
        items:
          $ref: '#/$defs/safeAbsolutePathString'
        minItems: 1
      config_family:
        type: string
        enum:
        - grub
        - isolinux
        - syslinux
        - ''
      line_match:
        type: string
      append_args:
        type: array
        items:
          type: string
          minLength: 1
      text_patches:
        type: array
        items:
          $ref: '#/$defs/textPatch'
      kernel_arg_patches:
        type: array
        items:
          $ref: '#/$defs/kernelArgPatch'
      script_patches:
        type: array
        items:
          $ref: '#/$defs/scriptPatch'
      placeholder_patches:
        type: array
        items:
          $ref: '#/$defs/placeholderPatch'
      encoding:
        type: string
        default: utf-8
    additionalProperties: true
  textPatch:
    type: object
    required:
    - kind
    - candidate_paths
    - find
    properties:
      kind:
        type: string
        enum:
        - replace_once
      candidate_paths:
        type: array
        items:
          $ref: '#/$defs/safeAbsolutePathString'
        minItems: 1
      find:
        type: string
        minLength: 1
      replace:
        type: string
    additionalProperties: true
  kernelArgPatch:
    type: object
    required:
    - config_family
    - selector
    - ensure_args
    properties:
      candidate_paths:
        type: array
        items:
          $ref: '#/$defs/safeAbsolutePathString'
        minItems: 1
      config_family:
        type: string
        enum:
        - grub
        - isolinux
        - syslinux
      selector:
        type: object
        properties:
          menuentry:
            type: string
          label:
            type: string
          kernel:
            type: string
          args_contains:
            type: array
            items:
              type: string
              minLength: 1
        additionalProperties: true
      ensure_args:
        type: array
        items:
          type: string
          minLength: 1
      remove_args:
        type: array
        items:
          type: string
          minLength: 1
      remove_lines_containing:
        type: array
        items:
          type: string
          minLength: 1
      insert_before:
        type: string
        default: '---'
    additionalProperties: true
  scriptPatch:
    type: object
    required:
    - kind
    - esp_image_path
    - esp_script_path
    - script
    properties:
      kind:
        type: string
        enum:
        - netboot_xyz_autoexec
        - ''
      candidate_paths:
        type: array
        items:
          $ref: '#/$defs/safeAbsolutePathString'
        minItems: 1
      esp_image_path:
        $ref: '#/$defs/safeAbsolutePathString'
      esp_script_path:
        type: string
        pattern: ^/.*
      script:
        type: string
        minLength: 1
      encoding:
        type: string
      padding:
        type: string
    additionalProperties: true
  placeholderPatch:
    type: object
    required:
    - candidate_paths
    - placeholder
    - replacement
    properties:
      candidate_paths:
        type: array
        items:
          $ref: '#/$defs/safeAbsolutePathString'
        minItems: 1
      placeholder:
        type: string
        minLength: 1
      replacement:
        type: string
      encoding:
        type: string
        default: ascii
      padding:
        type: string
        default: space
    additionalProperties: true
  safeAbsolutePathString:
    type: string
    pattern: ^/(?!/)(?=.{1,}$)(?!.*\.\./)
  workflowAction:
    type: object
    required:
    - id
    - type
    properties:
      id:
        type: string
        minLength: 1
      type:
        type: string
        enum:
        - render_template
        - compute_file_hash
        - create_partition
        - write_partition_files
        - generate_receipt
        - format_yaml_list
        - generate_ephemeral_password
        - hash_password
        - store_ephemeral_secret
        - show_ephemeral_secret_button
        - create_artifact
        - prepare_installer_iso
        - run_asset
      template:
        type: string
      output_var:
        type: string
      artifact_id:
        type: string
      logical_name:
        type: string
      media_type:
        type: string
      content_var:
        type: string
      input_var:
        type: string
      algorithm:
        type: string
        enum:
        - sha512_crypt
        - sha512-crypt
        - sha512crypt
      executable:
        type: boolean
      user_secret:
        type: boolean
        default: false
      user_secret_label:
        type: string
      command:
        type: array
        items:
          type: string
      when:
        $ref: '#/$defs/fieldCondition'
    additionalProperties: true
  hostEvent:
    type: object
    required:
    - event
    properties:
      event:
        type: string
        minLength: 1
      return_delivery:
        $ref: '#/$defs/returnDelivery'
      channel:
        type: string
      endpoint:
        type: string
      endpoint_id:
        type: string
      url:
        type: string
      method:
        type: string
      delivery_mode:
        type: string
        default: best_effort
      template:
        type: string
      from:
        type: string
      content_var:
        type: string
      media_type:
        type: string
      return_delivery_id:
        type: string
      return_delivery_endpoint:
        type: string
    additionalProperties: true
  returnDelivery:
    type: object
    anyOf:
    - required:
      - url
    - required:
      - endpoint
    - required:
      - endpoint_url
    properties:
      url:
        type: string
        format: uri
        pattern: ^(https://|\{\{)
      endpoint:
        type: string
      endpoint_url:
        type: string
      method:
        type: string
        enum:
        - POST
        - PUT
        - post
        - put
        default: POST
      delivery_mode:
        type: string
        enum:
        - required
        - best_effort
        default: best_effort
      template:
        type: string
      from:
        type: string
      content_var:
        type: string
      media_type:
        type: string
    additionalProperties: true
  fieldCondition:
    type: object
    required:
    - value
    properties:
      field:
        type: string
        minLength: 1
      selector:
        type: string
        minLength: 1
      operator:
        type: string
        default: equals
      op:
        type: string
        default: equals
      value:
        type: string
    additionalProperties: true
  wizardPage:
    type: object
    required:
    - id
    - title
    - fields
    properties:
      id:
        type: string
        minLength: 1
      title:
        type: string
        minLength: 1
      description:
        type: string
      fields:
        type: array
        items:
          type: string
          minLength: 1
        minItems: 1
    additionalProperties: true
  configField:
    type: object
    anyOf:
    - required:
      - id
    - required:
      - key
    properties:
      id:
        type: string
        minLength: 1
      key:
        type: string
        minLength: 1
      label:
        type: string
        minLength: 1
      type:
        type: string
        enum:
        - text
        - password
        - select
        - multiline
        - info
      default:
        type:
        - string
        - boolean
        - number
        - 'null'
      required:
        type: boolean
      description:
        type: string
      placeholder:
        type: string
      options:
        type: array
        items:
          oneOf:
          - type: string
          - type: object
            required:
            - value
            properties:
              value:
                type: string
              label:
                type: string
              default:
                type: boolean
              placeholder:
                type: boolean
            additionalProperties: true
      big:
        type: boolean
      advanced:
        type: boolean
      hidden:
        type: boolean
      obfuscated:
        type: boolean
      disabled:
        type: boolean
      immutable:
        type: boolean
      standard_field:
        type: string
      storage:
        type: object
        additionalProperties:
          type: string
      validation:
        type: object
        additionalProperties:
          type: string
      bindings:
        type: array
        items:
          $ref: '#/$defs/configBinding'
      fetch:
        $ref: '#/$defs/configFetch'
      when:
        $ref: '#/$defs/fieldCondition'
    additionalProperties: true
  shortConfigField:
    oneOf:
    - type: string
      minLength: 1
    - type: object
      minProperties: 1
      maxProperties: 1
      additionalProperties:
        type: object
        additionalProperties: true
  configBinding:
    type: object
    required:
    - consumer
    - target
    properties:
      consumer:
        type: string
      target:
        type: string
      destination:
        type: string
      encoding:
        type: string
    additionalProperties: true
  configFetch:
    type: object
    required:
    - url
    properties:
      url:
        type: string
        format: uri
        pattern: ^https://
      method:
        type: string
        const: GET
        default: GET
      media_type:
        type: string
      max_bytes:
        type: integer
        minimum: 1
    additionalProperties: true
  packageRootManifest:
    type: object
    required:
    - version
    - kind
    - metadata
    - documents
    properties:
      version:
        const: '2.2'
      kind:
        const: sparkplug.manifest
      metadata:
        allOf:
        - $ref: '#/$defs/metadata'
        - required:
          - manifest_root_sha256
        - not:
            required:
            - signature
      documents:
        type: object
        propertyNames:
          type: string
          minLength: 1
        additionalProperties:
          $ref: '#/$defs/packageDocumentRef'
        minProperties: 1
      files:
        type: object
        propertyNames:
          type: string
          minLength: 1
        additionalProperties:
          $ref: '#/$defs/packageFileRef'
      install_origin:
        type: string
        format: uri
    additionalProperties: true
  packageDocumentRef:
    type: object
    required:
    - role
    - sha256
    properties:
      role:
        type: string
        minLength: 1
      sha256:
        $ref: '#/$defs/sha256'
      url:
        $ref: '#/$defs/packageUrl'
      inline:
        $ref: '#/$defs/inlineText'
    additionalProperties: true
    allOf:
    - if:
        properties:
          url:
            type: string
        required:
        - url
      then:
        not:
          required:
          - inline
    - if:
        properties:
          inline:
            type: object
        required:
        - inline
      then:
        not:
          required:
          - url
  packageFileRef:
    type: object
    required:
    - sha256
    properties:
      sha256:
        $ref: '#/$defs/sha256'
      url:
        $ref: '#/$defs/packageUrl'
      inline:
        $ref: '#/$defs/inlineText'
      role:
        type: string
      media_type:
        type: string
      size:
        type: integer
        minimum: 0
    additionalProperties: true
    allOf:
    - if:
        properties:
          url:
            type: string
        required:
        - url
      then:
        not:
          required:
          - inline
    - if:
        properties:
          inline:
            type: object
        required:
        - inline
      then:
        not:
          required:
          - url
  packageUrl:
    type: string
    oneOf:
    - pattern: ^https://
    - pattern: ^http://localhost(:[0-9]+)?/
    - pattern: ^http://127\.0\.0\.1(:[0-9]+)?/
    - pattern: ^http://\[::1\](:[0-9]+)?/
    - pattern: ^http://10\.0\.2\.2(:[0-9]+)?/
    - pattern: ^http://10\.0\.3\.2(:[0-9]+)?/
    - pattern: ^http://penguin\.linux\.test(:[0-9]+)?/
    - pattern: ^http://.*\.linux\.test(:[0-9]+)?/
    - $ref: '#/$defs/relativeReference'
  inlineText:
    type: object
    required:
    - text
    properties:
      encoding:
        type: string
        default: utf-8
      text:
        type: string
    additionalProperties: true
